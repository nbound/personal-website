<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="nate fadrigon | game developer · programmer · game/level designer"
    />
    <title>nsite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mozilla+Text:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="landing-page">
    <main class="landing">
      <div class="landing-glow" aria-hidden="true"></div>

      <div class="linktree">
        <div class="profile reveal">
          <div class="avatar" aria-hidden="true">
            <img src="images/komari_pfp.png" />
          </div>
          <h1 class="profile-name">nbound</h1>
          <h1 class="profile-full-name">nate fadrigon</h1>
          <p class="profile-tagline">
            computer science student &middot; game developer &middot; game/level
            designer
          </p>
        </div>

        <ul class="link-list">
          <li class="reveal">
            <a
              href="home.html"
              id="enter-btn"
              class="link-btn link-btn-primary"
            >
              <i class="fa-solid fa-house" aria-hidden="true"></i>
              <span>enter site</span>
              <i
                class="fa-solid fa-arrow-right link-btn-end"
                aria-hidden="true"
              ></i>
            </a>
          </li>
          <li class="reveal">
            <a href="home.html#my-games" class="link-btn">
              <i class="fa-solid fa-gamepad" aria-hidden="true"></i>
              <span>my games</span>
              <i
                class="fa-solid fa-arrow-right link-btn-end"
                aria-hidden="true"
              ></i>
            </a>
          </li>
          <li class="reveal">
            <a
              href="https://github.com/nbound"
              class="link-btn"
              target="_blank"
              rel="noopener noreferrer"
            >
              <i class="fa-brands fa-github" aria-hidden="true"></i>
              <span>github</span>
              <i
                class="fa-solid fa-arrow-up-right-from-square link-btn-end"
                aria-hidden="true"
              ></i>
            </a>
          </li>
          <li class="reveal">
            <a
              href="https://nbound.itch.io"
              class="link-btn"
              target="_blank"
              rel="noopener noreferrer"
            >
              <i class="fa-brands fa-itch-io" aria-hidden="true"></i>
              <span>itch.io</span>
              <i
                class="fa-solid fa-arrow-up-right-from-square link-btn-end"
                aria-hidden="true"
              ></i>
            </a>
          </li>
          <li class="reveal">
            <a
              href="https://www.youtube.com/@nbound"
              class="link-btn"
              target="_blank"
              rel="noopener noreferrer"
            >
              <i class="fa-brands fa-youtube" aria-hidden="true"></i>
              <span>youtube</span>
              <i
                class="fa-solid fa-arrow-up-right-from-square link-btn-end"
                aria-hidden="true"
              ></i>
            </a>
          </li>
          <li class="reveal">
            <a
              href="https://x.com/nbound_"
              class="link-btn"
              target="_blank"
              rel="noopener noreferrer"
            >
              <i class="fa-brands fa-x-twitter" aria-hidden="true"></i>
              <span>x/twitter</span>
              <i
                class="fa-solid fa-arrow-up-right-from-square link-btn-end"
                aria-hidden="true"
              ></i>
            </a>
          </li>
        </ul>
      </div>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
